name: Linux

on:
  push:
    paths: ["linux/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["linux/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: linux

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, libadwaita, VTE and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Screenshot under Xvfb
        run: |
          sudo apt-get install -y --no-install-recommends xvfb imagemagick dbus-x11 fonts-dejavu-core adwaita-icon-theme librsvg2-common
          mkdir -p "$RUNNER_TEMP/ws" "$RUNNER_TEMP/shots"
          cp -r tests/fixtures/workspace/. "$RUNNER_TEMP/ws/" 2>/dev/null || true
          export OMUX_WORKSPACE_DIRECTORY="$RUNNER_TEMP/ws" GSK_RENDERER=cairo RUST_BACKTRACE=1
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- sh -c '
            ./target/release/omux > "$RUNNER_TEMP/shots/omux.log" 2>&1 & pid=$!
            sleep 7
            import -window root "$RUNNER_TEMP/shots/main.png"
            act() { gdbus call --session --dest net.pf1.omux --object-path /net/pf1/omux \
              --method org.gtk.Actions.Activate "$1" "[]" "{}" > /dev/null; sleep 2; }
            act settings
            import -window root "$RUNNER_TEMP/shots/settings.png"
            kill $pid || true'
          cat "$RUNNER_TEMP/shots/omux.log"
      - uses: actions/upload-artifact@v4
        with:
          name: omux-linux-x86_64
          path: |
            linux/target/release/omux
            linux/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
